table_columns_visible:
  "FASTQC (raw)":
    median_sequence_length: False
    total_sequences: False
    percent_duplicates: False
    percent_gc: False
  cutadapt:
    percent_trimmed: False
  "FASTQC (trimmed)":
    median_sequence_length: True
    total_sequences: True
    percent_duplicates: False
    percent_gc: False
  bowtie_ncrna_alignment:
    reads_aligned_percentage: True
    reads_aligned: False
  star_genome_alignment:
    uniquely_mapped_percent: True
    uniquely_mapped: False
    mapped_percent: True

table_columns_name:
  "FASTQC (trimmed)":
    median_sequence_length: "Median read length"
    total_sequences: "No. trimmed reads"
  bowtie_ncrna_alignment:
    reads_aligned_percentage: "rRNA reads"
  star_genome_alignment:
    uniquely_mapped_percent: "Uniquely mapped genomic reads"
    mapped_percent: "Genomic reads"

ignore_images: false

custom_content:
  order:
    - clipqc
    - software-versions-by-process
    - software-versions-unique

