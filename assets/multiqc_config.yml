report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/clipseq/tree/dev" target="_blank">nf-core/clipseq</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/clipseq/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-clipseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-clipseq-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# Run only these modules
run_modules:
  - custom_content
  - fastqc
  - cutadapt
  - bowtie1
  - star

module_order:
  - fastqc:
      name: "FastQC (raw)"
      anchor: "fastqc_raw"
      info: "This section of the report shows FastQC results before adapter trimming."
      path_filters:
        - "*_fastqc.zip"
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      anchor: "fastqc_trimmed"
      info: "This section of the report shows FastQC results after adapter trimming."
      path_filters:
        - "*_trimmed_fastqc.zip"
  - bowtie1:
      name: "BOWTIE ncRNA Alignment"
      path_filters:
        - "*.out"
  - star:
      name: "STAR Genome Alignment"
      path_filters:
        - "*.final.out"
  - custom_content

# Other MultiQC config stuff here
custom_data:
  mapping:
    parent_id: mapping
    parent_name: "Mapping"
    file_format: "tsv"
    section_name: "Mapping"
    description: "The mapping metrics for each experiment"
    plot_type: "bargraph"
  dedup_reads:
    parent_id: dedup
    parent_name: "Deduplication"
    file_format: "tsv"
    section_name: "Reads"
    description: "The number of reads before and after PCR deduplication for each experiment"
    plot_type: "bargraph"
    cats:
      - input_reads
      - output_reads
    pconfig:
      ylab: "Count"
      stacking: "group"
      cpswitch: False
      tt_percentages: False
  dedup_ratio:
    parent_id: dedup
    parent_name: "Deduplication"
    file_format: "tsv"
    section_name: "Ratio"
    description: "The PCR deduplication ratio for each experiment (input reads/reads left after deduplication)"
    plot_type: "bargraph"
    pconfig:
      ylab: "Ratio"
      #stacking: False
      cpswitch: False
      tt_percentages: False
  crosslinks_counts:
    parent_id: crosslinks
    parent_name: "Crosslinks"
    file_format: "tsv"
    section_name: "Counts"
    description: "The number of crosslinks or crosslink sites for each experiment"
    plot_type: "bargraph"
    cats:
      - number_of_cDNAs
      - total_positions_of_crosslinks
    pconfig:
      ylab: "Count"
      stacking: "group"
      cpswitch: False
      tt_percentages: False
  crosslinks_ratio:
    parent_id: crosslinks
    parent_name: "Crosslinks"
    file_format: "tsv"
    section_name: "Ratios"
    description: "The ratio of number of cDNA mapping to crosslink positions for each experiment"
    #plot_type: 'bargraph'
    pconfig:
      ylab: "Count"
      #stacking: False
      cpswitch: False
      tt_percentages: False
      tt_decimals: 2
  peaks_counts:
    parent_id: peaks
    parent_name: "Peaks"
    file_format: "tsv"
    section_name: "Counts"
    description: "The total number of peaks called by each peak caller"
    plot_type: "bargraph"
    cats:
      - clippy
      - icount
      - paraclu
      - pureclip
    pconfig:
      ylab: "Number of peaks"
      stacking: "group"
      cpswitch: False
      tt_percentages: False
  xlinks_in_peaks:
    parent_id: peaks
    parent_name: "Peaks"
    file_format: "tsv"
    section_name: "Crosslinks positions in peaks"
    description: "The total percentage of crosslinks within peaks for each peak caller"
    plot_type: 'bargraph'
    cats:
      - clippy
      - icount
      - paraclu
      - pureclip
    pconfig:
      ylab: "Percentage of crosslinks"
      stacking: "group"
      cpswitch: False
      tt_percentages: False
      tt_decimals: 2
      tt_suffix: "%"
  xlinksites_in_peaks:
    parent_id: peaks
    parent_name: "Peaks"
    file_format: "tsv"
    section_name: "Crosslinks positions in peaks"
    description: "The total percentage of crosslink sites within peaks for each peak caller"
    plot_type: 'bargraph'
    cats:
      - clippy
      - icount
      - paraclu
      - pureclip
    pconfig:
      ylab: "Percentage of crosslink sites"
      stacking: null
      cpswitch: False
      tt_percentages: False
      tt_decimals: 2
      tt_suffix: "%"
  peaks_xlinksite_coverage:
    parent_id: peaks
    parent_name: "Peaks"
    file_format: "tsv"
    section_name: "Peak-crosslink coverage"
    description: "The total percentage of nucleotides within peaks covered by a crosslink site"
    plot_type: "bargraph"
    cats:
      - clippy
      - icount
      - paraclu
      - pureclip
    pconfig:
      ylab: "Percentage of nucleotides within peaks"
      stacking: null
      cpswitch: False
      tt_percentages: False
      tt_decimals: 2
      tt_suffix: "%"
  deseq2_qc_plot_1:
      parent_id: deseq2_qc
      parent_name: PCA
      section_name: "PCA analysis of top 500 consensus peaks"
  deseq2_qc_plot_2:
      parent_id: deseq2_qc
      parent_name: PCA
      section_name: "PCA analysis of all consensus peaks"
  deseq2_qc_heatmap:
      parent_id: deseq2_qc
      parent_name: Heatmap
      section_name: "Heatmap of consensus peaks"
  summary_type:
    parent_id: Summary
    parent_name: "Summary"
    file_format: "tsv"
    section_name: "Percentage of cDNA premap"
    description: "The total percentage of cDNA summary mapped"
    plot_type: 'bargraph'
    cats:
      - CDS
      - ncRNA
      - intergenic
      - "premapped RNA"
    pconfig:
      ylab: "Type"
      stacking: "group"
      cpswitch: False
      tt_percentages: False
  summary_subtype:
    parent_id: Summary
    parent_name: "Summary"
    file_format: "tsv"
    section_name: "Percentage of cDNA premap subtypes"
    description: "The total percentage of cDNA subtypes mapped"
    #plot_type: 'bargraph'
    pconfig:
      ylab: "Type"
      #stacking: False
      cpswitch: False
      tt_percentages: False

sp:
  mapping:
    fn: "mapping.tsv"
  dedup_reads:
    fn: "dedup_reads.tsv"
  dedup_ratio:
    fn: "dedup_ratio.tsv"
  crosslinks_counts:
    fn: "xlinks_counts.tsv"
  crosslinks_ratio:
    fn: "xlinks_ratio.tsv"
  peaks:
    fn: "total_peaks.tsv"
  xlinks_in_peaks:
    fn: "xlinks_in_peaks.tsv"
  xlinksites_in_peaks:
    fn: "xlinksites_in_peaks.tsv"
  peaks_xlinksite_coverage:
    fn: "peaks_xlinksite_coverage.tsv"
  deseq2_qc_plot_1:
    fn: "*1.png"
  deseq2_qc_plot_2:
    fn: "*2.png"
  deseq2_qc_heatmap:
    fn: "*heatmap.png"
  summary_type:
    fn: "summary_type_metrics.tsv"
  summary_subtype:
    fn: 'summary_subtype_metrics.tsv'

table_columns_visible:
  "FASTQC (raw)":
    median_sequence_length: True
    total_sequences: True
    percent_duplicates: False
    percent_gc: False
  cutadapt:
    percent_trimmed: True
  "FASTQC (trimmed)":
    median_sequence_length: True
    total_sequences: True
    percent_duplicates: False
    percent_gc: False
  "BOWTIE ncRNA Alignment":
    reads_aligned_percentage: True
    reads_aligned: True
  "STAR Genome Alignment":
    uniquely_mapped_percent: True
    uniquely_mapped: True

ignore_images: false

custom_content:
  order:
    - clipqc
    - software-versions-by-process
    - software-versions-unique
