report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/clipseq/tree/dev" target="_blank">nf-core/clipseq</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/clipseq/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-clipseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-clipseq-summary":
    order: -1002

export_plots: true

disable_version_detection: true

section_comments:
  general_stats: "Key CLIPseq QC metrics<br><ul><li>Median len - Median read length (after trimming)</li><li>Seqs - Total number of reads which were trimmed</li><li>% Aligned - Percentage of reads which aligned to rRNA</li><li>M Aligned - Number of reads which aligned to rRNA</li><li>Aligned - Percentage of reads which lined to the reference genome</li><li>Uniq aligned - Percentage of these reads which aligned uniquely</li><li>PCR dedup ratio - Ratio of reads in vs cDNA out after PCR deduplication</li><li>Ratio of cDNA:XL - Ratio of total cDNAs to number of crosslink positions</li><li>XL events - Percentage of crosslinks within peaks</li></ul>"

# Run only these modules
run_modules:
  - custom_content
  - fastqc
  - cutadapt
  - bowtie1
  - star

module_order:
  - fastqc:
      name: "FastQC (raw)"
      anchor: "fastqc_raw"
      info: "This section of the report shows FastQC results before adapter trimming."
      path_filters:
        - "*_fastqc.zip"
  - cutadapt
  - fastqc:
      name: "FastQC (trimmed)"
      anchor: "fastqc_trimmed"
      info: "This section of the report shows FastQC results after adapter trimming."
      path_filters:
        - "*_trimmed_fastqc.zip"
  - bowtie1:
      name: "BOWTIE rRNA Alignment (pre-mapping)"
      path_filters:
        - "*.out"
  - star:
      name: "STAR Genome Alignment"
      path_filters:
        - "*.final.out"
  - custom_content

# Other MultiQC config stuff here
custom_data:
  mapping:
    parent_id: mapping
    parent_name: "Mapping"
    file_format: "tsv"
    section_name: "Mapping"
    description: "The mapping metrics for each experiment"
    plot_type: "bargraph"
  dedup_reads:
    parent_id: dedup
    parent_name: "Deduplication"
    file_format: "tsv"
    section_name: "Reads"
    description: "The number of reads before PCR deduplication, and number of cDNAs after, for each experiment"
    plot_type: "bargraph"
    cats:
      - input_reads
      - output_reads
    pconfig:
      ylab: "Count"
      stacking: "group"
      cpswitch: False
      tt_percentages: False
  crosslinks_counts:
    parent_id: crosslinks
    parent_name: "Crosslinks"
    file_format: "tsv"
    section_name: "Counts"
    description: "The number of crosslinks or crosslink sites for each experiment"
    plot_type: "bargraph"
    cats:
      - number_of_cDNAss
      - total_positions_of_crosslinks
    pconfig:
      ylab: "Count"
      stacking: "group"
      cpswitch: False
      tt_percentages: False
  dedup_ratio:
    file_format: "tsv"
    plot_type: "generalstats"
    pconfig:
      dedup_ratio:
        title: 'PCR dedup ratio'
        min: 0
  crosslinks_ratio:
    parent_id: crosslinks
    parent_name: "Crosslinks"
    file_format: "tsv"
    section_name: "Ratios"
    description: "The ratio of number of cDNAs to location of crosslinks"
    plot_type: "generalstats"
    pconfig:
      ratio:
        title: 'Ratio of cDNAs:XL'
        min: 0
        scale: 'RdYlGn'
  xlinks_in_peaks:
    parent_id: peaks
    parent_name: "Peaks"
    file_format: "tsv"
    section_name: "Crosslinks positions in peaks - clippy"
    description: "The percentage of crosslink sites which are called within peaks"
    plot_type: 'generalstats'
    pconfig:
      clippy:
        title: 'XL events (Clippy)'
        min: 0
        max: 100
        suffix: '%'
        scale: 'RdYlGn'
      icount:
        title: "XL events (Clippy)"
        min: 0
        max: 100
        suffix: "%"
        scale: 'RdYlGn'
      paraclu:
        title: 'Xl events (paraclu)'
        min: 0
        max: 100
        suffix: '%'
        scale: 'RdYlGn'
      pureclip:
        title: "XL events (pureclip)"
        min: 0
        max: 100
        suffix: "%"
        scale: 'RdYlGn'
  peaks_counts:
    parent_id: peaks
    parent_name: "Peaks"
    file_format: "tsv"
    section_name: "Counts"
    description: "The total number of peaks called by each peak caller"
    plot_type: "bargraph"
    cats:
      - clippy
      - icount
      - paraclu
      - pureclip
    pconfig:
      ylab: "Number of peaks"
      stacking: "group"
      cpswitch: False
      tt_percentages: False
  xlinksites_in_peaks:
    parent_id: peaks
    parent_name: "Peaks"
    file_format: "tsv"
    section_name: "Crosslinks positions in peaks"
    description: "The total percentage of crosslink sites within peaks for each peak caller"
    plot_type: 'bargraph'
    cats:
      - clippy
      - icount
      - paraclu
      - pureclip
    pconfig:
      ylab: "Percentage of crosslink sites"
      stacking: null
      cpswitch: False
      tt_percentages: False
      tt_decimals: 2
      tt_suffix: "%"
  peaks_xlinksite_coverage:
    parent_id: peaks
    parent_name: "Peaks"
    file_format: "tsv"
    section_name: "Peak-crosslink coverage"
    description: "The total percentage of nucleotides within peaks covered by a crosslink site"
    plot_type: "bargraph"
    cats:
      - clippy
      - icount
      - paraclu
      - pureclip
    pconfig:
      ylab: "Percentage of nucleotides within peaks"
      stacking: null
      cpswitch: False
      tt_percentages: False
      tt_decimals: 2
      tt_suffix: "%"
  deseq2_qc_plot_1:
      parent_id: deseq2_qc
      parent_name: "Consensus peaks"
      section_name: "PCA analysis of top 500 consensus peaks"
  deseq2_qc_plot_2:
      parent_id: deseq2_qc
      parent_name: "Consensus peaks"
      section_name: "PCA analysis of all consensus peaks"
  deseq2_qc_heatmap:
      parent_id: deseq2_qc
      parent_name: "Consensus peaks"
      section_name: "Heatmap of consensus peaks"
  peka_mqc_plots_clustermap:
      parent_id: peka_mqc
      parent_name: "Motif analysis (PEKA)"
      section_name: "PEKA clustermap"
      description: "Motif similarity (cosine distances) clustermap between samples"
  peka_mqc_plots_heatmap:
      parent_id: peka_mqc
      parent_name: "Motif analysis (PEKA)"
      section_name: "PEKA heatmap"
      description: "Motif enrichment heatmap for the top 20 k-mers per sample"
  icountmini_summary_mqc_subtype:
      parent_id: icountmini
      parent_name: "ICount-Mini summaries"
      section_name: "Subtype"
      description: "Crosslinks by subtype"
      plot_type: 'bargraph'
  icountmini_summary_mqc_type:
      parent_id: icountmini
      parent_name: "ICount-Mini summaries"
      section_name: "Type"
      description: "Crosslinks by type"
      plot_type: 'bargraph'
  summary_type:
    parent_id: Summary
    parent_name: "Summary"
    file_format: "tsv"
    section_name: "Percentage of cDNA premap"
    description: "The total percentage of cDNA summary mapped"
    plot_type: 'bargraph'
    cats:
      - CDS
      - ncRNA
      - intergenic
      - "premapped RNA"
    pconfig:
      ylab: "Type"
      stacking: "group"
      cpswitch: False
      tt_percentages: False
  summary_subtype:
    parent_id: Summary
    parent_name: "Summary"
    file_format: "tsv"
    section_name: "Percentage of cDNA premap subtypes"
    description: "The total percentage of cDNA subtypes mapped"
    #plot_type: 'bargraph'
    pconfig:
      ylab: "Type"
      #stacking: False
      cpswitch: False
      tt_percentages: False

